<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Dashboard Vendedora</title>

<link rel="stylesheet"
href="styles.css">

</head>

<body>

<div class="header-dashboard">

<h1>Panel de Vendedora</h1>

<div class="header-buttons">

<button
onclick="volver()"
class="btn-volver">

← Volver

</button>

<button
onclick="cerrarSesion()"
class="btn-logout">

Cerrar sesión

</button>

</div>

</div>


<div class="dashboard-grid">

<div
class="dashboard-card"

onclick="location.href='ventas.html'">

<h3>Registrar Venta</h3>

<p>
Registrar ventas
</p>

</div>


<div
class="dashboard-card"

onclick="location.href='productos_vendedora.html'">

<h3>Inventario</h3>

<p>
Consultar productos
</p>

</div>


<div
class="dashboard-card"

onclick="mostrarMisVentas()">

<h3>Mis Ventas</h3>

<p>
Ver historial
</p>

</div>

</div>


<div
id="panelVentas"

class="panel-ventas"

style="display:none;">

<h2>

Historial de Ventas

</h2>

<table>

<thead>

<tr>

<th>Fecha</th>

<th>Producto</th>

<th>Emprendimiento</th>

<th>Cantidad</th>

<th>Canal</th>

<th>Total</th>

</tr>

</thead>

<tbody
id="tablaMisVentas">

</tbody>

</table>

</div>

<script src="dashboard_vendedora.js">

</script>

</body>
